name: youtubenotify
services:
  youtubenotify:
    image: youtubenotify:2.0.1
    container_name: youtubenotify
    user: "10002:10002"
    init: true
    env_file: .env
    environment:
      BOT_ENV: prod
      BOT_MODE: polling
      STATE_FILE: /data/state.prod.json
    volumes:
      - /srv/storage/telegram/youtubenotify:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [bot]
networks:
  bot:
    name: youtubenotify-network
    driver: bridge
